
<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #f4f4f9;
    --paper-color: #ffffff;
    --accent-pink: #ffdae9;
    --accent-blue: #e1f5fe;
    --accent-yellow: #fff9c4;
    --text-color: #4a4a4a;
  }

  body {
    background-color: var(--bg-color);
    font-family: 'Indie Flower', cursive; 
    display: flex;
    justify-content: center;
    padding: 20px;
    color: var(--text-color);
    font-size: 1.3em;
  }

  .notebook-page {
    background-color: var(--paper-color);
    width: 850px;
    min-height: 1000px;
    border-radius: 15px;
    box-shadow: 10px 10px 25px rgba(0,0,0,0.1);
    position: relative;
    padding: 50px 50px 50px 110px;
    background-image: radial-gradient(#d1d1d1 1.2px, transparent 1.2px);
    background-size: 30px 30px;
  }

  .notebook-page::before {
    content: "";
    position: absolute;
    left: 35px; top: 0; bottom: 0; width: 40px;
    background: linear-gradient(to bottom, transparent 15px, #999 15px, #999 35px, transparent 35px);
    background-size: 100% 50px;
  }

  header { margin-bottom: 40px; text-align: center; }
  h1 { font-size: 3em; margin: 0 0 20px 0; color: #333; }

  /* App Icons Bar */
  .apps-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 30px;
  }

  .app-icon {
    display: inline-block;
    background: white;
    border: 2px solid #eee;
    border-radius: 15px;
    padding: 10px;
    text-align: center;
    text-decoration: none;
    color: inherit;
    font-size: 0.65em;
    min-width: 80px;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
  }
  .app-icon span { font-size: 1.8em; display: block; margin-bottom: 5px; }

  .content-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
  }

  /* Sezioni Testuali Interattive */
  .edit-box {
    width: 100%;
    background: transparent;
    border: none;
    font-family: inherit;
    font-size: 0.9em;
    resize: none;
    outline: none;
    color: #333;
    line-height: 1.4;
  }

  .sticky-note {
    background-color: var(--accent-yellow);
    padding: 25px;
    border-radius: 35px;
    border: 1px solid #f0e68c;
    margin-top: 20px;
    transform: rotate(1deg);
  }

  .highlight-box {
    background-color: var(--accent-blue);
    padding: 25px;
    border-radius: 20px;
    transform: rotate(-1deg);
    min-height: 180px;
  }

  /* Mood */
  .mood-selector { display: flex; gap: 15px; margin-top: 15px; }
  .mood-btn { cursor: pointer; font-size: 1.5em; opacity: 0.3; transition: 0.3s; }
  .mood-btn.active { opacity: 1; transform: scale(1.2); }

  h2 { border-bottom: 3px solid var(--accent-pink); display: inline-block; margin-bottom: 15px; }
/* --- ADATTAMENTO PER CELLULARE --- */
  /* --- FIX PER MOBILE: NIENTE PIÙ STRISCIA --- */

@media (max-width: 768px) {
  body {
    padding: 5px; /* Riduce lo spazio fuori dal foglio */
  }

  .notebook-page {
    width: 100%; /* Occupa tutto lo spazio disponibile */
    padding: 30px 15px 30px 50px; /* Riduce i margini interni (soprattutto a sinistra) */
    box-sizing: border-box; /* Impedisce al foglio di "uscire" dallo schermo */
    min-height: auto; /* Si allunga in base a quanto scrivi */
  }

  .notebook-page::before {
    left: 10px; /* Sposta la spirale più a sinistra per dare spazio al testo */
    width: 25px;
  }

  .content-grid {
    grid-template-columns: 1fr !important; /* Forza una colonna sola */
    gap: 30px;
  }

  h1 {
    font-size: 1.8em; /* Titolo più proporzionato */
    text-align: center;
  }

  /* Se hai le icone in alto, farle andare a capo bene */
  .apps-grid, header {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }
}
</style>
</head>
<body>

<div class="notebook-page">
  <header>
    <h1>Study Home</h1>
    <div class="apps-grid">
        <a href="quiz-cinese_app.html" class="app-icon"><span>📝</span>Esercizi</a>
        <a href="hub_lezione.html" class="app-icon"><span>🎥</span>Lezioni</a>
        <a href="vocabolario-creator.html" class="app-icon"><span>📖</span>Vocabolario</a>
        <a href="lingueEditor.html" class="app-icon"><span>✍️</span>Editor</a>
        <a href="builder.html" class="app-icon"><span>🛠️</span>Builder</a>
        <a href="https://grammar-creator.vercel.app/ " class="app-icon"><span>📚</span>Gramm.</a>
        <a href="mappe.html" class="app-icon"><span>🗺️</span>Mappe</a>
        <a href="libro-esercizi.html" class="app-icon"><span>🎓</span>Libro Es.</a>
        <a href="libro-cultura.html" class="app-icon"><span>🌍</span>Cultura</a>
        <a href="libro-lingue.html" class="app-icon"><span>📓</span>Libro Lez.</a>
    </div>
  </header>

  <div class="content-grid">
    <div class="left-col">
      <div class="section">
        <h2>Libreria PDF 📄</h2>
        <div style="font-size: 0.9em; line-height: 1.8;">
          <div>📄 Atena_Grammatica.pdf</div>
          <div>📄 chinese-per-i-bambini.pdf</div>
          </div>
      <a href="lettore-pdf.html">  <button style="margin-top:15px; padding: 10px 20px; border-radius: 12px; border: 1px solid #ccc; cursor: pointer; font-family: inherit; background: orange;">
            📎 Apri Lettore PDF
        </button></a>
      </div>
<hr>
      <div class="sticky-note">
        <h3 style="margin:0 0 10px 0; color:#d81b60;">Bacheca Note 📌</h3>
        <textarea id="note-area" class="edit-box" style="height: 120px;" placeholder="Scrivi qui i promemoria..."></textarea>
      </div>
    </div>

    <div class="right-col">
      <div class="highlight-box">
        <h3 style="margin:0 0 10px 0;">Avanzamento Studio 📝</h3>
        <textarea id="progress-area" class="edit-box" style="height: 140px;" placeholder="Cosa hai studiato oggi? Cosa devi fare domani?"></textarea>
      </div>

      <div class="section" style="margin-top: 40px;">
        <h2>Mood del Giorno 🧡</h2>
        <div class="mood-selector">
          <span class="mood-btn" onclick="setMood(0)">🧡</span>
          <span class="mood-btn" onclick="setMood(1)">🙂</span>
          <span class="mood-btn" onclick="setMood(2)">😐</span>
          <span class="mood-btn" onclick="setMood(3)">😴</span>
          <span class="mood-btn" onclick="setMood(4)">🫤</span>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // 1. Definiamo le aree di testo
    const noteArea = document.getElementById('note-area');
    const progressArea = document.getElementById('progress-area');

    // 2. Carichiamo i dati salvati
    const savedNote = localStorage.getItem('note-area');
    const savedProgress = localStorage.getItem('progress-area');

    // 3. Applichiamo i dati (con il tuo promemoria originale se è la prima volta)
    if (savedNote !== null) {
        noteArea.value = savedNote;
    } else {
        noteArea.value = "Ricordati di caricare i nuovi appunti entro venerdì! Il gruppo ti aspetta. ✨";
    }

    progressArea.value = savedProgress || "";

    // 4. Salvataggio istantaneo mentre scrivi
    noteArea.addEventListener('input', () => {
        localStorage.setItem('note-area', noteArea.value);
    });

    progressArea.addEventListener('input', () => {
        localStorage.setItem('progress-area', progressArea.value);
    });

    // --- GESTIONE MOOD (Invariata ma protetta) ---
    const moodBtns = document.querySelectorAll('.mood-btn');
    let savedMood = localStorage.getItem('userMood');
    
    if(savedMood !== null && moodBtns[savedMood]) {
        moodBtns[savedMood].classList.add('active');
    }

    window.setMood = function(idx) {
        moodBtns.forEach(b => b.classList.remove('active'));
        moodBtns[idx].classList.add('active');
        localStorage.setItem('userMood', idx);
    }
});


  </script>
</body>
</html>
